name: Compilar Moneto iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar Dependências
        run: npm ci

      - name: Gerar arquivos nativos iOS
        run: npx expo prebuild --platform ios --clean

      - name: Desabilitar code signing nos Pods
        run: |
          cat >> ios/Podfile << 'PATCH'

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ""
                config.build_settings['CODE_SIGNING_REQUIRED'] = "NO"
                config.build_settings['CODE_SIGNING_ALLOWED'] = "NO"
              end
            end
            installer.target_installation_results.pod_target_installation_results.each do |pod_name, target_installation_result|
              target_installation_result.resource_bundle_targets.each do |resource_bundle_target|
                resource_bundle_target.build_configurations.each do |config|
                  config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                end
              end
            end
          end
          PATCH

      - name: Reinstalar Pods com patch aplicado
        run: |
          cd ios
          pod install

      - name: Detectar scheme do Xcode
        id: scheme
        run: |
          cd ios
          SCHEME=$(xcodebuild -list -json | python3 -c "import sys,json; print(json.load(sys.stdin)['workspace']['schemes'][0])")
          echo "name=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Scheme detectado: $SCHEME"

      - name: Compilar App iOS sem assinatura
        run: |
          cd ios
          xcodebuild build \
            -workspace *.xcworkspace \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Empacotar Moneto.ipa
        run: |
          mkdir -p Payload
          cp -r ios/build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r Moneto.ipa Payload

      - name: Disponibilizar Moneto.ipa para download
        uses: actions/upload-artifact@v4
        with:
          name: moneto-ipa
          path: Moneto.ipa
