name: Compilar Moneto iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verificar versão do Xcode
        run: xcodebuild -version

      - name: Instalar Dependências
        run: npm ci

      - name: Gerar arquivos nativos iOS e instalar Pods
        run: npx expo prebuild --platform ios --clean

      - name: Compilar App iOS sem assinatura
        run: |
          cd ios
          xcodebuild build \
            -workspace Moneto.xcworkspace \
            -scheme Moneto \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Empacotar Moneto.ipa
        run: |
          mkdir -p Payload
          cp -r ios/build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r -y Moneto.ipa Payload

      - name: Disponibilizar Moneto.ipa para download
        uses: actions/upload-artifact@v7
        with:
          name: moneto-ipa
          path: Moneto.ipa
