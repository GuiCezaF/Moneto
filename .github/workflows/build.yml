name: Compilar Moneto iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verificar versão do Xcode
        run: xcodebuild -version

      - name: Instalar Dependências
        run: npm ci

      - name: Gerar arquivos nativos iOS e instalar Pods
        run: npx expo prebuild --platform ios --clean

      - name: Detectar scheme do Xcode
        id: scheme
        run: |
          cd ios
          SCHEME=$(xcodebuild -list -json | python3 -c "import sys,json; print(json.load(sys.stdin)['workspace']['schemes'][0])")
          echo "name=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Scheme detectado: $SCHEME"

      - name: Compilar App iOS sem assinatura
        run: |
          cd ios
          xcodebuild build \
            -workspace *.xcworkspace \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Empacotar Moneto.ipa
        run: |
          mkdir -p Payload
          cp -r ios/build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r -y Moneto.ipa Payload

      - name: Disponibilizar Moneto.ipa para download
        uses: actions/upload-artifact@v4
        with:
          name: moneto-ipa
          path: Moneto.ipa
